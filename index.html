<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Fermi Poker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <div class="rays" aria-hidden="true"></div>
    <div class="dust" aria-hidden="true"></div>

    <svg class="frame" viewBox="0 0 750 1334" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff3d8b" />
          <stop offset="50%" stop-color="#a96bff" />
          <stop offset="100%" stop-color="#21e1ff" />
        </linearGradient>
      </defs>

      <g fill="none" stroke="url(#frameGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <!-- outer rectangle with broken corners for ornament insertion -->
        <path d="M 60 110 L 60 1224" />
        <path d="M 690 110 L 690 1224" />
        <path d="M 110 60 L 640 60" />
        <path d="M 110 1274 L 640 1274" />

        <!-- inner accent line -->
        <path d="M 78 130 L 78 1204" opacity="0.55" />
        <path d="M 672 130 L 672 1204" opacity="0.55" />
        <path d="M 128 78 L 622 78" opacity="0.55" />
        <path d="M 128 1256 L 622 1256" opacity="0.55" />

        <!-- top-left corner ornament -->
        <g>
          <path d="M 60 110 Q 60 60 110 60" />
          <path d="M 78 130 Q 78 78 130 78" opacity="0.55" />
          <path d="M 60 150 L 80 130 L 100 150 L 80 170 Z" />
          <path d="M 100 60 L 130 78 L 100 96 L 80 78 Z" transform="translate(0,0)" />
          <circle cx="80" cy="150" r="2.5" fill="url(#frameGrad)" stroke="none" />
        </g>

        <!-- top-right corner ornament -->
        <g transform="translate(750,0) scale(-1,1)">
          <path d="M 60 110 Q 60 60 110 60" />
          <path d="M 78 130 Q 78 78 130 78" opacity="0.55" />
          <path d="M 60 150 L 80 130 L 100 150 L 80 170 Z" />
          <path d="M 100 60 L 130 78 L 100 96 L 80 78 Z" />
          <circle cx="80" cy="150" r="2.5" fill="url(#frameGrad)" stroke="none" />
        </g>

        <!-- bottom-left corner ornament -->
        <g transform="translate(0,1334) scale(1,-1)">
          <path d="M 60 110 Q 60 60 110 60" />
          <path d="M 78 130 Q 78 78 130 78" opacity="0.55" />
          <path d="M 60 150 L 80 130 L 100 150 L 80 170 Z" />
          <path d="M 100 60 L 130 78 L 100 96 L 80 78 Z" />
          <circle cx="80" cy="150" r="2.5" fill="url(#frameGrad)" stroke="none" />
        </g>

        <!-- bottom-right corner ornament -->
        <g transform="translate(750,1334) scale(-1,-1)">
          <path d="M 60 110 Q 60 60 110 60" />
          <path d="M 78 130 Q 78 78 130 78" opacity="0.55" />
          <path d="M 60 150 L 80 130 L 100 150 L 80 170 Z" />
          <path d="M 100 60 L 130 78 L 100 96 L 80 78 Z" />
          <circle cx="80" cy="150" r="2.5" fill="url(#frameGrad)" stroke="none" />
        </g>
      </g>
    </svg>

    <section class="content">
      <h1 class="title">
        <span class="title-line">FERMI</span>
        <span class="title-line">POKER</span>
      </h1>

      <a class="play-btn" href="play.html" aria-label="Play Fermi Poker">PLAY</a>
    </section>
  </main>
</body>
</html>
